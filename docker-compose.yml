version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: discord-bot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: discord_bot_platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - discord-bot-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discord-bot-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/discord_bot_platform?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - FRONTEND_URL=http://localhost:5173
      # Discord OAuth (thay bằng credentials thực)
      - DISCORD_CLIENT_ID=your_discord_client_id
      - DISCORD_CLIENT_SECRET=your_discord_client_secret
      - DISCORD_CALLBACK_URL=http://localhost:5000/api/auth/discord/callback
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - discord-bot-network

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: discord-bot-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - discord-bot-network

volumes:
  mongodb_data:

networks:
  discord-bot-network:
    driver: bridge
